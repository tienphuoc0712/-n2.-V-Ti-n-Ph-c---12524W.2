<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị | Jollibee – Đồ án 2</title>
<link href="../vendor/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<style>
body{background:#f4f5f7}
.side{background:var(--dark);min-height:100vh;color:#fff;padding:18px 0;position:sticky;top:0}
.side .brand{font-family:'Baloo 2',cursive;font-weight:800;font-size:26px;padding:0 20px 14px;color:var(--yellow)}
.side a{display:block;padding:12px 20px;color:#ddd;font-weight:800;cursor:pointer}
.side a:hover,.side a.on{background:var(--red);color:#fff}
.top{background:#fff;padding:12px 24px;border-bottom:1px solid #e5e5e5;display:flex;justify-content:space-between;align-items:center}
.stat{background:#fff;border-radius:16px;padding:18px;border-left:6px solid var(--red)}
.stat b{font-size:26px;color:var(--red);display:block}
.bar{background:var(--red);border-radius:6px 6px 0 0;width:100%}
.tbl{background:#fff;border-radius:16px;overflow:hidden}
.tbl th{background:#fafafa;font-size:13px;text-transform:uppercase}
.thumb{width:48px;height:48px;object-fit:cover;border-radius:10px}
</style>
</head>
<body>
<div class="row g-0">
  <aside class="col-md-2 side" id="side"></aside>
  <main class="col-md-10">
    <div class="top"><b id="ptitle" style="font-size:20px"></b><span><span id="who"></span> · <a href="../TrangChu.html">Về trang bán hàng</a> · <a href="#" id="out">Đăng xuất</a></span></div>
    <div class="p-3 p-md-4" id="view"></div>
  </main>
</div>

<div class="modal fade" id="pm" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="pmT">Món ăn</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="pid">
    <div class="mb-2"><label class="form-label">Tên món *</label><input id="pn" class="form-control"></div>
    <div class="row g-2 mb-2"><div class="col-7"><label class="form-label">Danh mục</label><select id="pc" class="form-select"></select></div><div class="col-5"><label class="form-label">Giá (đ) *</label><input id="pp" class="form-control" inputmode="numeric"></div></div>
    <div class="mb-2"><label class="form-label">Mô tả</label><textarea id="pd" rows="2" class="form-control"></textarea></div>
    <div class="mb-2"><label class="form-label">Đường dẫn hình ảnh (tùy chọn)</label><input id="pi" class="form-control" placeholder="https://..."></div>
    <label class="me-3"><input type="checkbox" id="ph"> Bán chạy</label><label><input type="checkbox" id="pa" checked> Đang bán</label>
    <div class="invalid-msg" id="pe"></div>
  </div>
  <div class="modal-footer"><button class="btn-line" data-bs-dismiss="modal">Hủy</button><button class="btn-jb" id="psave">Lưu</button></div>
</div></div></div>

<div class="modal fade" id="om" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="omT"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="omB"></div>
</div></div></div>

<script src="../vendor/jquery.min.js"></script>
<script src="../vendor/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="admin.js"></script>
</body>
</html>
