<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đơn hàng của tôi | Jollibee </title>
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="jb-header"></div>
<div class="page-banner"><h1>Đơn hàng của tôi</h1><p>Theo dõi trạng thái các đơn đã đặt</p></div>

<div class="container sec" style="padding-top:28px"><div id="list"></div></div>

<div id="jb-footer"></div>
<script src="vendor/jquery.min.js"></script>
<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
JB.layout("");

var me=JB.me();
if(!me)location.href="DangNhap.html?next=DonHang.html";
else{
 function draw(){
  var os=JB.orders().filter(function(o){return o.userId===me.id;});
  if(!os.length){$("#list").html('<div class="text-center py-5 text-muted">Bạn chưa có đơn hàng nào.<br><a class="btn-jb mt-3" href="ThucDon.html">Đặt món ngay</a></div>');return;}
  $("#list").html(os.map(function(o){return '<div class="box mb-3"><div class="d-flex flex-wrap justify-content-between align-items-center"><div><b>#'+o.id+'</b> <small class="text-muted">'+new Date(o.date).toLocaleString("vi-VN")+'</small></div><span class="status st-'+o.status+'">'+JB.STATUS[o.status]+'</span></div><hr>'+
   o.items.map(function(i){return '<div class="sum-line"><span>'+i.qty+' × '+JB.esc(i.name)+'</span><span>'+JB.money(i.price*i.qty)+'</span></div>';}).join('')+
   '<div class="small text-muted mt-2">Người nhận: '+JB.esc(o.name)+' · '+JB.esc(o.phone)+' · '+JB.esc(o.address)+'</div>'+
   '<div class="d-flex justify-content-between align-items-center mt-2"><b style="color:var(--red);font-size:20px">'+JB.money(o.total)+'</b>'+(o.status==="cho_xac_nhan"?'<button class="btn-line cx" data-id="'+o.id+'">Hủy đơn</button>':'')+'</div></div>';}).join(''));
 }
 $("#list").on("click",".cx",function(){if(confirm("Bạn chắc chắn muốn hủy đơn này?")){JB.cancelOrder($(this).data("id"));draw();JB.toast("Đã hủy đơn hàng");}});
 draw();
}

</script>
</body>
</html>
