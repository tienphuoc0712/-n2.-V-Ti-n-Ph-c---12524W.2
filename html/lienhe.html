<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ | Jollibee – Đồ án 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/chung.css">
  <link rel="stylesheet" href="../css/lienhe.css">
</head>
<body onload="khoiTaoLienHe()">
<div id="jb-header"></div>

<div class="page-banner"><h1>Liên hệ</h1><p>Chúng tôi luôn lắng nghe bạn</p></div>

<div class="container sec khung-lh"><div class="box">
  <h4>GỬI GÓP Ý CHO CỬA HÀNG</h4>
  <form id="f" novalidate>
    <div class="truong"><label class="nhan">Họ và tên</label><input id="n" class="o-nhap"></div>
    <div class="truong"><label class="nhan">Email</label><input id="e" class="o-nhap" type="email"></div>
    <div class="truong"><label class="nhan">Nội dung</label><textarea id="m" rows="4" class="o-nhap"></textarea></div>
    <div class="invalid-msg mb2" id="err"></div><button class="btn-jb">Gửi phản hồi</button>
  </form>
</div></div>

<div id="jb-footer"></div>
<script src="../js/dulieu.js"></script>
<script src="../js/chung.js"></script>
<script src="../js/lienhe.js"></script>
</body>
</html>
