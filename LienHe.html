<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liên hệ | Jollibee </title>
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="jb-header"></div>
<div class="page-banner"><h1>Liên hệ</h1><p>Chúng tôi luôn lắng nghe bạn</p></div>

<div class="container sec" style="max-width:720px"><div class="box">
  <h4 style="font-weight:900;color:var(--red)">GỬI GÓP Ý CHO CỬA HÀNG</h4>
  <form id="f" novalidate>
    <div class="mb-3"><label class="form-label">Họ và tên</label><input id="n" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Email</label><input id="e" class="form-control" type="email"></div>
    <div class="mb-3"><label class="form-label">Nội dung</label><textarea id="m" rows="4" class="form-control"></textarea></div>
    <div class="invalid-msg mb-2" id="err"></div><button class="btn-jb">Gửi phản hồi</button>
  </form>
</div></div>

<div id="jb-footer"></div>
<script src="vendor/jquery.min.js"></script>
<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
JB.layout("LienHe.html");

$("#f").on("submit",function(ev){ev.preventDefault();var n=$("#n").val().trim(),e=$("#e").val().trim(),m=$("#m").val().trim(),x="";
 if(!n||!m)x="Vui lòng nhập họ tên và nội dung.";else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))x="Email không hợp lệ.";
 if(x){$("#err").text(x);return;}$("#err").text("");
 try{var a=JSON.parse(localStorage.getItem("jb_contacts")||"[]");a.unshift({n:n,e:e,m:m,d:new Date().toISOString()});localStorage.setItem("jb_contacts",JSON.stringify(a));}catch(x2){}
 this.reset();JB.toast("Cảm ơn bạn! Chúng tôi đã nhận được phản hồi.");});

</script>
</body>
</html>
